<!doctype html>
<html lang="fa" dir="rtl" style="height: 100%; padding: 0; margin: 0">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>در حال آماده‌سازی</title>

    <style>
      body {
        height: 100%;
        padding: 0;
        margin: 0;
        font-size: 20px;
      }

      .image-bg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        background-image: url("Circuit.png");
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
      }

      .image-bg .red-cover {
        width: 100%;
        height: 100%;
        opacity: 0.5;
        background-color: #7a0000;
      }

      .content-container {
        position: relative;
        z-index: 10;
        display: flex;
        justify-content: center;
        align-items: center;
        text-align: center;
        flex-wrap: wrap;
        height: 100%;
        color: white;
      }

      .bigger-text {
        width: 100%;
        font-size: 4rem;
        margin: 0;
        font-weight: bold;
      }

      .smaller-text {
        width: 100%;
        font-size: 1.5em;
        margin-top: 25px;
        font-weight: bold;
      }

      @media (max-width: 1024px) {
        body {
          font-size: 18px;
        }
      }
      @media (max-width: 768px) {
        body {
          font-size: 16px;
        }
        .bigger-text {
          font-size: 3rem;
        }
      }
      @media (max-width: 480px) {
        body {
          font-size: 14px;
        }
      }
    </style>
  </head>

  <body>
    <div class="image-bg">
      <div class="red-cover"></div>
    </div>
    <div class="content-container">
      <div class="bigger-text">پیست در حال آماده‌سازی است</div>
      <div class="smaller-text">ماشین‌ها را برای مسابقه آماده کن</div>
    </div>
  </body>
</html>
