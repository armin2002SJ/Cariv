<!doctype html>
<html lang="fa" dir="rtl" style="height: 100%; padding: 0; margin: 0">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>در حال آماده‌سازی</title>

    <style>
      body {
        position: relative;
        height: 100%;
        padding: 0;
        margin: 0;
      }

      .image-bg {
        position: absolute;
        top: 0;
        left: 0;
        min-height: 100%;
        min-width: 100%;
      }

      .image-bg img {
        height: 100%;
        width: 100%;
      }

      .image-bg .red-cover {
        position: absolute;
        inset: 0;
        z-index: 10;
        opacity: 0.5;
        background-color: #7a0000;
      }

      h1 {
        font-size: 70px;
        margin: 0;
        font-weight: 900;
      }

      p {
        font-size: 28px;
        margin-top: 25px;
        color: #aaa;
      }
    </style>
  </head>

  <body>
    <div class="image-bg">
      <img src="Circuit.png" />
      <div class="red-cover"></div>
    </div>
    <div>
      <h1>پیست در حال آماده‌سازی است</h1>
      <p>ماشین‌ها را برای مسابقه آماده کن</p>
    </div>
  </body>
</html>
